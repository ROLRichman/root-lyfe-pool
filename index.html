<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Root Lyfe Pool 🎱 PRO</title>
<style>
html, body { margin:0; padding:0; background:#0b0f1a; overflow:hidden; font-family:Arial; }
#gameContainer { width:100vw; height:100vh; position:relative; }
canvas { width:100%; height:100%; display:block; background:#2e6f57; }
#ui { position:absolute; top:10px; width:100%; text-align:center; color:white; }
#powerBar { width:60%; height:12px; background:#222; margin:10px auto; border-radius:6px; }
#powerFill { height:100%; width:0%; background:linear-gradient(90deg,#22c55e,#facc15); }
#shareBtn { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); padding:10px 20px; background:#22c55e; border:none; border-radius:8px; font-weight:bold; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="poolCanvas"></canvas>
  <div id="ui">
    <div id="scoreBoard">Score: 0</div>
    <div id="powerBar"><div id="powerFill"></div></div>
  </div>
  <button id="shareBtn">Challenge Friend</button>
</div>

<script>
const canvas = document.getElementById('poolCanvas');
const ctx = canvas.getContext('2d');
const powerFill = document.getElementById('powerFill');
const scoreBoard = document.getElementById('scoreBoard');

let balls = [];
let pockets = [];
let aiming = false;
let pointer = {x:0,y:0};
let power = 0;
let maxPower = 70;
let score = 0;
const R = 14;

// ----------------- FULLSCREEN -----------------
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', ()=>{ resizeCanvas(); initGame(); });
resizeCanvas();

// ----------------- INIT GAME -----------------
function initGame(){
  balls = [];
  score = 0;
  scoreBoard.innerText = "Score: " + score;

  // Cue ball far left for controlled break
  balls.push({ x: canvas.width*0.15, y: canvas.height/2, dx:0, dy:0, r:R, color:'white', id:0, potted:false });

  // Rack colors
  const colors = ['yellow','blue','red','purple','orange','green','maroon','black'];
  let startX = canvas.width*0.75;
  let startY = canvas.height/2;
  let index = 0;
  const spacing = R*2 + 2; // tiny gap to prevent overlap

  for(let row=0; row<5; row++){
    for(let col=0; col<=row; col++){
      balls.push({
        x: startX + row*spacing,
        y: startY - row*R + col*spacing,
        dx:0, dy:0,
        r:R,
        color: colors[index % colors.length],
        id: index+1,
        potted:false
      });
      index++;
    }
  }

  // Pockets
  pockets = [
    {x:0,y:0},{x:canvas.width/2,y:0},{x:canvas.width,y:0},
    {x:0,y:canvas.height},{x:canvas.width/2,y:canvas.height},{x:canvas.width,y:canvas.height}
  ];
}
initGame();

// ----------------- HELPERS -----------------
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function ballsStopped(){ return balls.every(b=>b.dx===0 && b.dy===0); }

// ----------------- COLLISION -----------------
function resolveCollision(a,b){
  let dx = b.x - a.x;
  let dy = b.y - a.y;
  let distAB = Math.hypot(dx,dy);
  if(distAB === 0) return;

  let nx = dx/distAB;
  let ny = dy/distAB;

  let vx = a.dx - b.dx;
  let vy = a.dy - b.dy;

  let speed = vx*nx + vy*ny;
  if(speed > 0) return;

  // Limit impulse to avoid balls flying
  let impulse = Math.max(Math.min(1.2 * speed, 3), -3);
  a.dx -= impulse * nx;
  a.dy -= impulse * ny;
  b.dx += impulse * nx;
  b.dy += impulse * ny;

  // separate overlap
  let overlap = a.r + b.r - distAB;
  a.x -= overlap*nx/2;
  a.y -= overlap*ny/2;
  b.x += overlap*nx/2;
  b.y += overlap*ny/2;
}

// ----------------- UPDATE -----------------
function update(){
  balls.forEach(b=>{
    b.x += b.dx; b.y += b.dy;
    b.dx *= 0.985; b.dy *= 0.985;
    if(Math.abs(b.dx)<0.05) b.dx=0; if(Math.abs(b.dy)<0.05) b.dy=0;

    // Rails
    if(b.x < b.r){ b.x=b.r; b.dx*=-0.9; }
    if(b.x > canvas.width - b.r){ b.x=canvas.width-b.r; b.dx*=-0.9; }
    if(b.y < b.r){ b.y=b.r; b.dy*=-0.9; }
    if(b.y > canvas.height - b.r){ b.y=canvas.height-b.r; b.dy*=-0.9; }

    // Pockets
    pockets.forEach(p=>{
      if(!b.potted && dist(b,p) < 24){
        if(b.id===0){
          b.x=canvas.width*0.15; b.y=canvas.height/2; b.dx=0; b.dy=0; return;
        }
        b.x=-100; b.y=-100; b.dx=0; b.dy=0; b.potted=true;
        score++; scoreBoard.innerText = "Score: "+score;
      }
    });
  });

  // Ball collisions
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      resolveCollision(balls[i], balls[j]);
    }
  }

  draw();
  requestAnimationFrame(update);
}
update();

// ----------------- DRAW -----------------
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#2e6f57"; ctx.fillRect(0,0,canvas.width,canvas.height);

  // pockets
  pockets.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,24,0,Math.PI*2);
    ctx.fillStyle="black";
    ctx.fill();
  });

  // balls
  balls.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle=b.color;
    ctx.fill();
  });

  // aim line
  if(aiming){
    let dx = pointer.x - balls[0].x;
    let dy = pointer.y - balls[0].y;
    let angle = Math.atan2(dy,dx);
    ctx.beginPath();
    ctx.moveTo(balls[0].x, balls[0].y);
    ctx.lineTo(balls[0].x + Math.cos(angle)*300, balls[0].y + Math.sin(angle)*300);
    ctx.strokeStyle="white"; ctx.lineWidth=2; ctx.stroke();
  }
}

// ----------------- INPUT -----------------
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  if(e.touches) return { x:e.touches[0].clientX-rect.left, y:e.touches[0].clientY-rect.top };
  return { x:e.clientX-rect.left, y:e.clientY-rect.top };
}

canvas.addEventListener('mousedown', e=>{
  if(!ballsStopped()) return;
  aiming=true; power=0; pointer=getPos(e);
});
canvas.addEventListener('mousemove', e=>{ if(aiming) pointer=getPos(e); });
canvas.addEventListener('mouseup', shoot);
canvas.addEventListener('touchstart', e=>{ if(!ballsStopped()) return; aiming=true; power=0; pointer=getPos(e); });
canvas.addEventListener('touchmove', e=>{ pointer=getPos(e); });
canvas.addEventListener('touchend', shoot);

// ----------------- SHOOT -----------------
function shoot(){
  if(!aiming) return;
  aiming=false;
  let dx = pointer.x - balls[0].x;
  let dy = pointer.y - balls[0].y;
  let dist = Math.hypot(dx,dy);
  if(dist===0) return;
  let nx = dx/dist;
  let ny = dy/dist;
  let strength = power*0.2; // moderated for controlled break
  balls[0].dx = nx*strength; balls[0].dy = ny*strength;
  power=0; powerFill.style.width="0%";
}

// ----------------- POWER BUILD -----------------
setInterval(()=>{
  if(aiming){
    power = Math.min(power+1.2, maxPower);
    powerFill.style.width = (power/maxPower*100)+"%";
  }
},16);

// ----------------- SHARE -----------------
document.getElementById('shareBtn').onclick=()=>{ prompt("Send this to your friend:", window.location.href); };

// ----------------- OPTIONAL: AUTO BREAK -----------------
// Uncomment next line to do an automatic controlled break at start
// setTimeout(()=>{ balls[0].dx = 15; balls[0].dy = 0; }, 500);
</script>
</body>
</html>
