<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Root Lyfe Pool 🎱</title>
<style>
html, body { margin:0; padding:0; background:#222; height:100%; }
#gameContainer { position:relative; width:100%; max-width:900px; margin:auto; }
#poolCanvas { width:100%; height:auto; display:block; background:#35654d; border:2px solid #222; }
#scoreBoard { color:#fff; text-align:center; margin:10px 0; font-family:sans-serif; font-size:18px; }
#powerBar { width:80%; height:15px; background:#444; margin:10px auto; border-radius:5px; overflow:hidden; }
#powerFill { width:0%; height:100%; background:#ff0; }
button { padding:8px 16px; margin:5px; font-size:16px; cursor:pointer; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="poolCanvas"></canvas>
  <div id="scoreBoard">Score: 0</div>
  <div id="powerBar"><div id="powerFill"></div></div>
  <div style="text-align:center;">
    <button id="shareBtn">Challenge a Friend</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/uuid@9.0.0/dist/umd/uuidv4.min.js"></script>
<script>
const canvas = document.getElementById('poolCanvas');
const ctx = canvas.getContext('2d');
const scoreBoard = document.getElementById('scoreBoard');
const powerFill = document.getElementById('powerFill');
const shareBtn = document.getElementById('shareBtn');

let balls = [];
let pockets = [];
let mouse = {x:0, y:0};
let isAiming = false;
let power = 0;
let score = 0;

// Resize canvas to container
function resizeCanvas(){
  canvas.width = canvas.parentElement.offsetWidth;
  canvas.height = canvas.width * 0.5;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Initialize balls and pockets
function initGame(){
  balls = [{x:150, y:canvas.height/2, dx:0, dy:0, color:'white', number:0}];
  const colors = ['yellow','blue','red','purple','orange','green','maroon','black'];
  for(let i=0;i<8;i++){
    balls.push({x:500+i*15, y:canvas.height/2, dx:0, dy:0, color:colors[i], number:i+1});
  }
  pockets = [
    {x:0, y:0}, {x:canvas.width/2, y:0}, {x:canvas.width, y:0},
    {x:0, y:canvas.height}, {x:canvas.width/2, y:canvas.height}, {x:canvas.width, y:canvas.height}
  ];
}
initGame();

// Distance helper
function distance(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

// Collision
function handleCollisions(){
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      let b1=balls[i], b2=balls[j];
      let dist=distance(b1,b2);
      if(dist<12*2){
        let angle=Math.atan2(b2.y-b1.y, b2.x-b1.x);
        let totalV=Math.hypot(b1.dx-b2.dx,b1.dy-b2.dy);
        b1.dx=-totalV*Math.cos(angle)*0.9;
        b1.dy=-totalV*Math.sin(angle)*0.9;
        b2.dx=totalV*Math.cos(angle)*0.9;
        b2.dy=totalV*Math.sin(angle)*0.9;
      }
    }
  }
}

// Draw
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // pockets
  pockets.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,20,0,Math.PI*2);
    ctx.fillStyle='black';
    ctx.fill();
    ctx.closePath();
  });
  // balls
  balls.forEach(ball=>{
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,12,0,Math.PI*2);
    ctx.fillStyle=ball.color;
    ctx.fill();
    ctx.strokeStyle='black';
    ctx.stroke();
    ctx.closePath();
  });
  // cue line
  if(isAiming){
    ctx.beginPath();
    ctx.moveTo(balls[0].x, balls[0].y);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.strokeStyle='white';
    ctx.lineWidth=4;
    ctx.stroke();
  }
}

// Update physics
function update(){
  balls.forEach(ball=>{
    ball.x += ball.dx;
    ball.y += ball.dy;
    ball.dx *=0.98;
    ball.dy *=0.98;
    // wall bounce
    if(ball.x<12 || ball.x>canvas.width-12) ball.dx*=-1;
    if(ball.y<12 || ball.y>canvas.height-12) ball.dy*=-1;
    // pockets
    pockets.forEach(p=>{
      if(distance(ball,p)<20 && ball.number!==0){
        ball.x=-100; ball.y=-100; ball.dx=0; ball.dy=0;
        score++;
        scoreBoard.innerText = "Score: "+score;
        // TODO: send score to leaderboard backend
      }
    });
  });
  handleCollisions();
  draw();
  requestAnimationFrame(update);
}
update();

// Mouse / touch
canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  mouse.x=e.clientX-rect.left;
  mouse.y=e.clientY-rect.top;
});
canvas.addEventListener('mousedown', ()=>{ isAiming=true; power=0; });
canvas.addEventListener('mouseup', ()=>{
  isAiming=false;
  let dx = balls[0].x - mouse.x;
  let dy = balls[0].y - mouse.y;
  balls[0].dx = dx*0.02*power;
  balls[0].dy = dy*0.02*power;
  power=0;
  powerFill.style.width="0%";
});
canvas.addEventListener('mousemove', ()=>{
  if(isAiming){
    power = Math.min(power+1,100);
    powerFill.style.width=power+"%";
  }
});

// Share / Challenge
shareBtn.addEventListener('click', ()=>{
  const roomID = uuidv4();
  const url = `${window.location.origin}${window.location.pathname}?room=${roomID}`;
  prompt("Share this link with a friend to play:", url);
});

// TODO: WebSocket / leaderboard integration
</script>
</body>
</html>
