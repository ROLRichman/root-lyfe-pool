<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Root Lyfe Pool 🎱</title>

<style>
html, body {
  margin:0;
  padding:0;
  background:#0b0f1a;
  font-family:Arial;
}

#gameContainer {
  width:100%;
  max-width:1000px;
  margin:auto;
  text-align:center;
}

canvas {
  width:100%;
  display:block;
  border-radius:12px;
  background:#2e6f57;
}

#scoreBoard {
  color:white;
  margin:10px;
  font-size:18px;
}

#powerBar {
  width:80%;
  height:12px;
  background:#333;
  margin:10px auto;
  border-radius:6px;
  overflow:hidden;
}

#powerFill {
  height:100%;
  width:0%;
  background:#22c55e;
}

button {
  padding:10px 20px;
  margin:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="gameContainer">
  <canvas id="poolCanvas"></canvas>
  <div id="scoreBoard">Score: 0</div>
  <div id="powerBar"><div id="powerFill"></div></div>
  <button id="shareBtn">Challenge a Friend</button>
</div>

<script>
const canvas = document.getElementById('poolCanvas');
const ctx = canvas.getContext('2d');

const scoreBoard = document.getElementById('scoreBoard');
const powerFill = document.getElementById('powerFill');
const shareBtn = document.getElementById('shareBtn');

let balls = [];
let pockets = [];
let mouse = {x:0,y:0};
let aiming = false;
let power = 0;
let maxPower = 25;
let score = 0;

// 🔥 RESPONSIVE CANVAS (FIXED PERFECTLY)
function resizeCanvas(){
  const w = canvas.parentElement.offsetWidth;
  const h = window.innerHeight * 0.75;

  canvas.width = w;
  canvas.height = Math.min(w * 0.8, h);
}
window.addEventListener('resize', ()=>{ resizeCanvas(); initGame(); });
resizeCanvas();

// 🎱 INIT GAME
function initGame(){
  balls = [];

  // cue ball
  balls.push({x:150, y:canvas.height/2, dx:0, dy:0, color:'white', r:10, id:0});

  // rack
  let colors = ['yellow','blue','red','purple','orange','green','maroon','black'];
  let startX = canvas.width * 0.7;
  let startY = canvas.height/2;

  let index = 0;
  for(let row=0; row<4; row++){
    for(let col=0; col<=row; col++){
      balls.push({
        x:startX + row*20,
        y:startY - row*10 + col*20,
        dx:0,
        dy:0,
        color:colors[index % colors.length],
        r:10,
        id:index+1
      });
      index++;
    }
  }

  pockets = [
    {x:0,y:0},{x:canvas.width/2,y:0},{x:canvas.width,y:0},
    {x:0,y:canvas.height},{x:canvas.width/2,y:canvas.height},{x:canvas.width,y:canvas.height}
  ];
}
initGame();

// helper
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

// 🎯 COLLISION (SMOOTH + CONTROLLED)
function collisions(){
  for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      let a = balls[i], b = balls[j];
      let d = dist(a,b);

      if(d < a.r + b.r){
        let angle = Math.atan2(b.y-a.y, b.x-a.x);
        let force = 0.4;

        let vx = Math.cos(angle)*force;
        let vy = Math.sin(angle)*force;

        a.dx -= vx;
        a.dy -= vy;
        b.dx += vx;
        b.dy += vy;
      }
    }
  }
}

// 🎨 DRAW
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // table
  ctx.fillStyle="#2e6f57";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // pockets
  pockets.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,18,0,Math.PI*2);
    ctx.fillStyle="black";
    ctx.fill();
  });

  // balls
  balls.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle=b.color;
    ctx.fill();
  });

  // aim line
  if(aiming){
    ctx.beginPath();
    ctx.moveTo(balls[0].x, balls[0].y);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.strokeStyle="white";
    ctx.lineWidth=2;
    ctx.stroke();
  }
}

// ⚙️ PHYSICS ENGINE (REALISTIC)
function update(){
  balls.forEach(b=>{
    b.x += b.dx;
    b.y += b.dy;

    // friction
    b.dx *= 0.96;
    b.dy *= 0.96;

    if(Math.abs(b.dx)<0.05) b.dx=0;
    if(Math.abs(b.dy)<0.05) b.dy=0;

    // walls
    if(b.x < b.r || b.x > canvas.width - b.r) b.dx *= -0.8;
    if(b.y < b.r || b.y > canvas.height - b.r) b.dy *= -0.8;

    // pockets
    pockets.forEach(p=>{
      if(dist(b,p)<18 && b.id!==0){
        b.x=-100; b.y=-100;
        b.dx=b.dy=0;
        score++;
        scoreBoard.innerText="Score: "+score;
      }
    });
  });

  collisions();
  draw();
  requestAnimationFrame(update);
}
update();

// 🎮 CONTROLS (SMOOTH POWER SYSTEM)
canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', ()=>{
  aiming = true;
  power = 0;
});

canvas.addEventListener('mouseup', ()=>{
  aiming = false;

  let dx = balls[0].x - mouse.x;
  let dy = balls[0].y - mouse.y;
  let angle = Math.atan2(dy, dx);

  balls[0].dx = Math.cos(angle) * power * 0.5;
  balls[0].dy = Math.sin(angle) * power * 0.5;

  power = 0;
  powerFill.style.width="0%";
});

// hold to charge
setInterval(()=>{
  if(aiming){
    power = Math.min(power + 0.5, maxPower);
    powerFill.style.width = (power/maxPower*100)+"%";
  }
},16);

// 🔗 SHARE
shareBtn.addEventListener('click', ()=>{
  prompt("Challenge a friend:", window.location.href);
});
</script>

</body>
</html>
